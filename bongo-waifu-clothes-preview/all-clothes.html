  <title>Bongo Waifu — Unlocked Clothes</title>
  <script>
    (() => {
      if (window.location.protocol !== "file:") return;
      document.documentElement.classList.add("file-bootstrap");
      const minimumApiVersion = 8;
      const origins = Array.from({ length: 10 }, (_, index) => `http://127.0.0.1:${54811 + index}`);
      let redirected = false;

      function encodeLook(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";
        bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
        return btoa(binary).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
      }

      function openAnimatedPreview(origin) {
        if (redirected) return;
        redirected = true;
        let fragment = "";
        try {
          const savedLook = localStorage.getItem("bongo-waifu-local-visual-v2");
          if (savedLook) fragment = `#look=${encodeLook(savedLook)}`;
        } catch { }
        window.location.replace(`${origin}/all-clothes.html${fragment}`);
      }

      window.addEventListener("message", (event) => {
        if (!origins.includes(event.origin)) return;
        if (event.data?.source !== "bongo-preview-discovery") return;
        if (Number(event.data.apiVersion) >= minimumApiVersion) openAnimatedPreview(event.origin);
      });

      function probeLocalServers() {
        if (redirected || !document.body) return;
        document.querySelectorAll(".bongo-server-probe").forEach((frame) => frame.remove());
        origins.forEach((origin) => {
          const frame = document.createElement("iframe");
          frame.className = "bongo-server-probe";
          frame.hidden = true;
          frame.setAttribute("aria-hidden", "true");
          frame.src = `${origin}/preview-discovery.html?t=${Date.now()}`;
          document.body.appendChild(frame);
        });
      }

      window.addEventListener("DOMContentLoaded", () => {
        const gate = document.createElement("div");
        const spinner = document.createElement("span");
        const message = document.createElement("strong");
        const help = document.createElement("small");
        gate.className = "launch-gate";
        gate.setAttribute("role", "status");
        spinner.className = "launch-spinner";
        spinner.setAttribute("aria-hidden", "true");
        message.textContent = "Opening…";
        help.textContent = "Run “Open Bongo Wardrobe.cmd” if this screen does not change.";
        gate.append(spinner, message, help);
        document.body.appendChild(gate);
        probeLocalServers();
        window.setInterval(probeLocalServers, 2000);
      }, { once: true });
    })();
  </script>

      "Brinquedos": 1,
    };
    const localVisualStorageKey = "bongo-waifu-local-visual-v2";
    let activeGroup = "Todas";
    let selectedByGroup = new Map(requiredDefaults);
    let activeAnimations = { action: "Idle", level: "Level_0", stain: "body_stain_00" };
    let spinePreview = null;
    let renderVersion = 0;
    let detectedGame = null;
    let toastTimer = 0;
    let gameDialogTimer = 0;

    function formatName(value) {
      return String(value || "")
        .replace(/_/g, " ")
        .replace(/([a-zÀ-ÿ])([A-Z])/g, "$1 $2")
        .replace(/([A-Z])([A-Z][a-z])/g, "$1 $2")
        .replace(/\s+/g, " ")
        .trim();
    }

    function setStatus(message, error = false) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle("error", error);
      toast.classList.add("visible");
      toastTimer = window.setTimeout(() => toast.classList.remove("visible"), error ? 5200 : 2600);
    }

    function setGameDialogState(state, title, message, options = {}) {
      window.clearTimeout(gameDialogTimer);
      gameDialog.dataset.state = state;
      gameDialogIcon.textContent = state === "success" ? "✓" : state === "error" ? "!" : state === "confirm" ? (options.icon || "▶") : "";
      gameDialogTitle.textContent = title;
      gameDialogMessage.textContent = message;
      gameDialogActions.hidden = state === "progress" || state === "success";
      gameDialogCancel.hidden = !options.showCancel;
      gameDialogConfirm.hidden = !options.confirmLabel;
      gameDialogConfirm.value = state === "confirm" ? "confirm" : "dismiss";
      gameDialogConfirm.textContent = options.confirmLabel || "";
      gameDialog.setAttribute("aria-busy", String(state === "progress"));
      if (!gameDialog.open) {
        gameDialog.returnValue = "";
        gameDialog.showModal();
      }
    }

    function confirmGameAction({ title, message, confirmLabel, icon = "▶" }) {
      setGameDialogState("confirm", title, message, { confirmLabel, icon, showCancel: true });
      return new Promise((resolve) => {
        gameDialog.addEventListener("close", () => resolve(gameDialog.returnValue === "confirm"), { once: true });
      });
    }

    function showGameProgress(title, message) {
      setGameDialogState("progress", title, message);
    }

    function showGameResult(state, title, message) {
      const success = state === "success";
      setGameDialogState(state, title, message, {
        confirmLabel: success ? "" : ui("Fechar", "Close"),
      });
      if (success) {
        gameDialogTimer = window.setTimeout(() => {
          if (gameDialog.open) gameDialog.close("done");
        }, 1500);
      }
    }

    function usingLocalLauncher() {
      return window.location.protocol === "http:" && window.location.hostname === "127.0.0.1";
    }

    async function apiJson(path, options = {}) {
      const response = await fetch(path, options);
      let payload = {};
      try { payload = await response.json(); } catch { }
      if (!response.ok) throw new Error(payload.error || ui(`Erro local ${response.status}.`, `Local error ${response.status}.`));
      return payload;
    }

    function equippedItems() {
      return groupOrder.map((group) => selectedByGroup.get(group)).filter(Boolean);
    }

    function itemById(id) {
      return allItems.find((item) => item.id === Number(id));
    }

    function snapshot() {
      return {
        equipped: Object.fromEntries([...selectedByGroup].map(([group, item]) => [group, item.id])),
      };
    }

    function writeLocalVisual() {
      try { localStorage.setItem(localVisualStorageKey, JSON.stringify(snapshot())); } catch { }
    }

    function readTransferredVisual() {
      const encoded = new URLSearchParams(window.location.hash.slice(1)).get("look");
      if (!encoded) return null;
      try {
        let base64 = encoded.replaceAll("-", "+").replaceAll("_", "/");
        while (base64.length % 4) base64 += "=";
        const bytes = Uint8Array.from(atob(base64), (character) => character.charCodeAt(0));
        const value = JSON.parse(new TextDecoder().decode(bytes));
        window.history.replaceState(null, "", window.location.pathname + window.location.search);
        return value && typeof value === "object" ? value : null;
      } catch {
        return null;
      }
    }

    function readLocalVisual() {
      const transferred = readTransferredVisual();
      if (transferred) return transferred;
      try {
        const value = JSON.parse(localStorage.getItem(localVisualStorageKey) || "null");
        return value && typeof value === "object" ? value : null;
      } catch {
        return null;
      }
    }

    function restoreSnapshot(look) {
      const restored = new Map();
      Object.entries(look?.equipped || {}).forEach(([group, id]) => {
        const item = itemById(id);
        if (item?.group === group) restored.set(group, item);
      });
      requiredDefaults.forEach((item, group) => {
        if (!restored.has(group)) restored.set(group, item);
      });
      selectedByGroup = restored;
    }

    async function renderModel(animateChange = false) {
      const version = ++renderVersion;
      const items = equippedItems();
      if (!usingLocalLauncher() || !spinePreview) {
        const fallback = items[items.length - 1];
        if (fallback) {
          characterImage.src = fallback.preview || fallback.image;
          characterImage.hidden = false;
        }
        characterStage.classList.remove("is-loading");
        return;
      }
      characterStage.classList.add("is-loading");
      try {
        await spinePreview.applyLook(items, activeAnimations, { animateChange });
        if (version !== renderVersion) return;
        characterImage.hidden = true;
        characterStage.classList.add("spine-active");
      } catch (error) {
        if (version !== renderVersion) return;
        setStatus(ui("Falha ao abrir o modelo.", "Could not open the model."), true);
        console.error(error);
      } finally {
        if (version === renderVersion) characterStage.classList.remove("is-loading");
      }
    }

    function selectItem(item) {
      const selected = selectedByGroup.get(item.group);
      if (selected?.id === item.id) {
        if (requiredDefaults.has(item.group)) {
          setStatus(ui("Escolha outra opção.", "Choose another option."));
          return;
        }
        selectedByGroup.delete(item.group);
      } else {
        selectedByGroup.set(item.group, item);
      }
      updateItemSelectionState();
      renderModel(true);
      writeLocalVisual();
    }

    function makeFilter(name) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = groupLabel(name);
      button.setAttribute("aria-pressed", String(activeGroup === name));
      button.addEventListener("click", () => {
        activeGroup = name;
        renderFilters();
        renderItems();
        catalogScroll.scrollTop = 0;
      });
      return button;
    }

    function renderFilters() {
      filters.replaceChildren(makeFilter("Todas"), ...groupOrder.map(makeFilter));
    }

    function makeItemCard(item) {
      const button = document.createElement("button");
      const thumb = document.createElement("span");
      const image = document.createElement("img");
      const name = document.createElement("span");
      button.type = "button";
      button.className = "item";
      button.dataset.itemGroup = item.group;
      button.dataset.itemId = String(item.id);
      button.title = `${groupLabel(item.group)} · ${formatName(item.name)}`;
      button.setAttribute("aria-label", button.title);
      button.setAttribute("aria-pressed", String(selectedByGroup.get(item.group)?.id === item.id));
      thumb.className = "thumb";
      image.src = item.image;
      image.alt = "";
      name.className = "name";
      name.textContent = formatName(item.name);
      thumb.appendChild(image);
      button.append(thumb, name);
      button.addEventListener("click", () => selectItem(item));
      return button;
    }

    function updateItemSelectionState() {
      groups.querySelectorAll(".item[data-item-group][data-item-id]").forEach((button) => {
        const selected = selectedByGroup.get(button.dataset.itemGroup);
        button.setAttribute("aria-pressed", String(String(selected?.id ?? "") === button.dataset.itemId));
      });
    }

    function renderItems() {
      const needle = search.value.trim().toLocaleLowerCase(uiLocale);
      const filtered = allItems.filter((item) => {
        const groupMatches = activeGroup === "Todas" || item.group === activeGroup;
        const text = `${item.name} ${formatName(item.name)} ${item.id} ${item.group} ${groupLabel(item.group)}`.toLocaleLowerCase(uiLocale);
        return groupMatches && (!needle || text.includes(needle));
      });
      groups.replaceChildren();
      if (!filtered.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = ui("Nenhum resultado", "No results");
        groups.appendChild(empty);
        return;
      }
      groupOrder.forEach((group) => {
        const items = filtered.filter((item) => item.group === group);
        if (!items.length) return;
        const section = document.createElement("section");
        if (activeGroup === "Todas") {
          const heading = document.createElement("h2");
          heading.textContent = groupLabel(group);
          section.appendChild(heading);
        }
        const grid = document.createElement("div");
        grid.className = "grid";
        items.forEach((item) => grid.appendChild(makeItemCard(item)));
        section.appendChild(grid);
        groups.appendChild(section);
      });
    }

    function playCharacterAnimation() {
      if (!spinePreview?.ready) return;
      const result = spinePreview.gameClick();
      if (result.reason === "toy-required") setStatus(ui("Escolha um brinquedo.", "Choose a toy."));
    }

    function initializeSpinePreview() {
      if (!usingLocalLauncher() || !window.BongoSpinePreview) return;
      spinePreview = new window.BongoSpinePreview(document.getElementById("spine-player"), {
        onAnimation(event) {
          if (event?.name) characterStage.dataset.animation = event.name;
          if (event?.layer) characterStage.dataset.animationLayer = event.layer;
          if (event?.layer && Object.hasOwn(activeAnimations, event.layer)) activeAnimations[event.layer] = event.name;
        },
        onState(state, error) {
          characterStage.classList.toggle("is-loading", state === "loading" || state === "updating");
          if (state === "ready") characterStage.classList.add("spine-active");
          if (state === "error") {
            characterStage.classList.remove("spine-active");
            setStatus(ui("Falha ao abrir as animações.", "Could not open animations."), true);
            console.error(error);
          }
        },
      });
      spinePreview.initialize().catch((error) => {
        setStatus(ui("Falha ao abrir as animações.", "Could not open animations."), true);
        console.error(error);
      });
    }

    async function detectGameInstallation() {
      if (!usingLocalLauncher()) return;
      try {
        detectedGame = await apiJson("/api/status");
      } catch {
        detectedGame = null;
      }
    }

    function bytesToBase64(bytes) {
      let binary = "";
      for (let index = 0; index < bytes.length; index += 8192) {
        binary += String.fromCharCode(...bytes.subarray(index, index + 8192));
      }
      return btoa(binary);
    }

    function base64ToBytes(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, (character) => character.charCodeAt(0));
    }

    function gameAesKey() {
      const key = new Uint8Array(32);
      key.set(new TextEncoder().encode("RamenIsAGoodCat"));
      return key;
    }

    async function gameMacKey(key) {
      const suffix = new TextEncoder().encode("::mac");
      const material = new Uint8Array(key.length + suffix.length);
      material.set(key);
      material.set(suffix, key.length);
      return new Uint8Array(await crypto.subtle.digest("SHA-256", material));
    }

    async function gameMac(plainJson, key) {
      const imported = await crypto.subtle.importKey("raw", await gameMacKey(key), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      return bytesToBase64(new Uint8Array(await crypto.subtle.sign("HMAC", imported, new TextEncoder().encode(plainJson))));
    }

    async function decryptGameSave(contents) {
      const prefix = "ENCRYPTED_";
      if (!contents.startsWith(prefix)) throw new Error(ui("Save incompatível.", "Incompatible save."));
      const key = gameAesKey();
      const imported = await crypto.subtle.importKey("raw", key, { name: "AES-CBC" }, false, ["decrypt"]);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-CBC", iv: new Uint8Array(16) }, imported, base64ToBytes(contents.slice(prefix.length).trim()));
      const signedJson = new TextDecoder().decode(decrypted);
      const match = signedJson.match(/^(.*),"_hmac":"([^"]+)"}$/s);
      if (!match) throw new Error(ui("Save inválido.", "Invalid save."));
      const plainJson = `${match[1]}}`;
      if (await gameMac(plainJson, key) !== match[2]) throw new Error(ui("Assinatura inválida.", "Invalid signature."));
      return JSON.parse(plainJson);
    }

    async function encryptGameSave(data) {
      const key = gameAesKey();
      const plainJson = JSON.stringify(data);
      const signature = await gameMac(plainJson, key);
      const signedJson = `${plainJson.slice(0, -1)},"_hmac":"${signature}"}`;
      const imported = await crypto.subtle.importKey("raw", key, { name: "AES-CBC" }, false, ["encrypt"]);
      const encrypted = await crypto.subtle.encrypt({ name: "AES-CBC", iv: new Uint8Array(16) }, imported, new TextEncoder().encode(signedJson));
      return `ENCRYPTED_${bytesToBase64(new Uint8Array(encrypted))}`;
    }

    function nativeSelection() {
      return Object.fromEntries(groupOrder.map((group) => [
        group,
        selectedByGroup.get(group)?.id || requiredDefaults.get(group)?.id || 0,
      ]));
    }

    async function saveLookToGame() {
      if (!usingLocalLauncher()) {
        setStatus(ui("Abra pelo lançador.", "Open through the launcher."), true);
        return;
      }
      gameSaveButton.disabled = true;
      nativeRestoreButton.disabled = true;
      const originalLabel = gameSaveButton.textContent;
      gameSaveButton.textContent = "…";
      try {
        let saveSource = await apiJson("/api/game-save");
        let gameData = await decryptGameSave(saveSource.contents);
        const approved = await confirmGameAction({
          title: ui("Abrir no jogo?", "Open in the game?"),
          message: ui("O visual será aplicado e o Bongo Waifu será aberto.", "The look will be applied and Bongo Waifu will open."),
          confirmLabel: ui("Abrir jogo", "Open game"),
        });
        if (!approved) return;
        showGameProgress(
          ui("Preparando…", "Preparing…"),
          ui("Aplicando o visual e abrindo o jogo.", "Applying the look and opening the game.")
        );
        if (saveSource.running) {
          await apiJson("/api/game-stop", { method: "POST" });
          saveSource = await apiJson("/api/game-save");
          if (saveSource.running) throw new Error(ui("Feche o jogo e tente novamente.", "Close the game and try again."));
          gameData = await decryptGameSave(saveSource.contents);
        }
        const selection = nativeSelection();
        Object.entries(gameFieldByGroup).forEach(([group, field]) => {
          const targetId = Number(selection[group] || 0);
          const proxyId = targetId ? Number(nativeProxyByGroup[group]) : 0;
          gameData[field] = proxyId;
          gameData[`desired${field}`] = proxyId;
          if (`lastVerified${field}` in gameData) gameData[`lastVerified${field}`] = proxyId;
        });
        const updated = await encryptGameSave(gameData);
        await apiJson("/api/native-apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ selection, original: saveSource.contents, updated, restartGame: true }),
        });
        showGameResult("success", ui("Pronto", "Done"), ui("O jogo está abrindo.", "The game is opening."));
        window.setTimeout(detectGameInstallation, 2500);
      } catch (error) {
        showGameResult(
          "error",
          ui("Não foi possível abrir", "Could not open"),
          error?.message || String(error)
        );
      } finally {
        gameSaveButton.disabled = false;
        nativeRestoreButton.disabled = false;
        gameSaveButton.textContent = originalLabel;
      }
    }

    async function restoreNativeLook() {
      if (!usingLocalLauncher()) {
        setStatus(ui("Abra pelo lançador.", "Open through the launcher."), true);
        return;
      }
      const approved = await confirmGameAction({
        title: ui("Restaurar visual?", "Restore the look?"),
        message: ui("O visual original será restaurado e o jogo será aberto.", "The original look will be restored and the game will open."),
        confirmLabel: ui("Restaurar", "Restore"),
        icon: "↺",
      });
      if (!approved) return;
      moreMenu.open = false;
      gameSaveButton.disabled = true;
      nativeRestoreButton.disabled = true;
      try {
        showGameProgress(
          ui("Restaurando…", "Restoring…"),
          ui("Preparando o visual original.", "Preparing the original look.")
        );
        const status = detectedGame || await apiJson("/api/status");
        if (status.running) await apiJson("/api/game-stop", { method: "POST" });
        await apiJson("/api/native-restore", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ restartGame: true }),
        });
        showGameResult("success", ui("Pronto", "Done"), ui("O jogo está abrindo.", "The game is opening."));
        window.setTimeout(detectGameInstallation, 2500);
      } catch (error) {
        showGameResult(
          "error",
          ui("Não foi possível restaurar", "Could not restore"),
          error?.message || String(error)
        );
      } finally {
        gameSaveButton.disabled = false;
        nativeRestoreButton.disabled = false;
      }
    }

    function resetLook() {
      selectedByGroup = new Map(requiredDefaults);
      activeAnimations = { action: "Idle", level: "Level_0", stain: "body_stain_00" };
      updateItemSelectionState();
      renderModel(false);
      writeLocalVisual();
      setStatus(ui("Redefinido", "Reset"));
    }

    localizeUi();
    const restored = readLocalVisual();
    if (restored) restoreSnapshot(restored);
    renderFilters();
    renderItems();
    initializeSpinePreview();
    renderModel(false);
    detectGameInstallation();

    search.addEventListener("input", () => {
      renderItems();
      catalogScroll.scrollTop = 0;
    });
    characterStage.addEventListener("click", playCharacterAnimation);
    characterStage.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        playCharacterAnimation();
      }
    });
    document.getElementById("animate-button").addEventListener("click", playCharacterAnimation);
    document.getElementById("reset-button").addEventListener("click", resetLook);
    gameSaveButton.addEventListener("click", saveLookToGame);
    nativeRestoreButton.addEventListener("click", restoreNativeLook);
    gameDialog.addEventListener("cancel", (event) => {
      if (!['confirm', 'error'].includes(gameDialog.dataset.state)) event.preventDefault();
    });
    gameDialog.addEventListener("click", (event) => {
      if (event.target === gameDialog && gameDialog.dataset.state === "confirm") gameDialog.close("cancel");
    });
  </script>
</body>
